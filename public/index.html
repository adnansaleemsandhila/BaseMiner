<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asteroid Miner Tycoon Pro</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; }
        body { background: radial-gradient(circle, #0f1123 0%, #030305 100%); color: #fff; display: flex; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
        
        .game-container { width: 100%; max-width: 480px; padding: 20px; text-align: center; background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 28px; backdrop-filter: blur(12px); box-shadow: 0 20px 60px rgba(0,0,0,0.6); margin: 10px; position: relative; }
        h1 { font-size: 1.6rem; letter-spacing: 2px; color: #f39c12; text-shadow: 0 0 10px rgba(243, 156, 18, 0.3); margin-bottom: 15px; }
        
        .score-board { background: rgba(0, 0, 0, 0.5); padding: 12px; border-radius: 18px; margin-bottom: 15px; border: 1px solid rgba(243, 156, 18, 0.2); position: relative; overflow: hidden; }
        .score-label { font-size: 0.8rem; text-transform: uppercase; color: #888; letter-spacing: 1px; }
        .score-value { font-size: 2.6rem; font-weight: bold; color: #f1c40f; text-shadow: 0 0 15px rgba(241, 196, 15, 0.3); }
        
        /* Level Progress Bar */
        .progress-container { width: 100%; background: #2c3e50; height: 8px; border-radius: 4px; margin-bottom: 20px; overflow: hidden; }
        .progress-bar { width: 0%; height: 100%; background: linear-gradient(90deg, #f1c40f, #e67e22); transition: width 0.3s ease; }

        /* Enhanced Animated Asteroid Arena */
        .asteroid-wrapper { margin: 25px 0; display: flex; justify-content: center; position: relative; }
        .asteroid { width: 190px; height: 190px; background: radial-gradient(circle, #9b59b6 10%, #34495e 100%); border-radius: 40% 60% 50% 50% / 50% 40% 60% 50%; box-shadow: inset -15px -15px 40px rgba(0,0,0,0.8), 0 0 40px rgba(155, 89, 182, 0.4); cursor: pointer; transition: transform 0.05s ease; animation: float 5s ease-in-out infinite; position: relative; }
        .asteroid:active { transform: scale(0.90) rotate(-3deg); }
        
        /* Critical Hit Glow Ring */
        .crit-indicator { position: absolute; width: 210px; height: 210px; border: 3px dashed #e74c3c; border-radius: 50%; animation: spin 10s linear infinite; opacity: 0; pointer-events: none; transition: opacity 0.2s; }
        .crit-ready { opacity: 0.7; }

        @keyframes float { 0%, 100% { transform: translateY(0px) scale(1); } 50% { transform: translateY(-8px) scale(1.02); } }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* Floating Damage/Gold Numbers */
        .floating-num { position: absolute; font-weight: 900; font-size: 1.5rem; pointer-events: none; animation: floatUp 0.8s cubic-bezier(0.18, 0.89, 0.32, 1.28) forwards; text-shadow: 0 2px 4px rgba(0,0,0,0.8); z-index: 10; }
        @keyframes floatUp { 0% { opacity: 1; transform: translateY(0) scale(0.8); } 100% { opacity: 0; transform: translateY(-80px) scale(1.2); } }

        /* Upgrade Shop Layout */
        .shop-container { display: flex; flex-direction: column; gap: 10px; max-height: 200px; overflow-y: auto; padding-right: 5px; margin-top: 10px; }
        .shop-item { display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.04); padding: 10px 15px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.06); transition: all 0.2s; }
        .shop-item:hover { background: rgba(255,255,255,0.08); }
        .item-info { text-align: left; }
        .item-title { font-weight: bold; font-size: 0.95rem; color: #ecf0f1; }
        .item-desc { font-size: 0.75rem; color: #888; }
        .btn-buy { background: #27ae60; color: white; border: none; padding: 8px 14px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 0.85rem; transition: background 0.2s; }
        .btn-buy:disabled { background: #7f8c8d; opacity: 0.3; cursor: not-allowed; }

        .stats-bar { display: flex; justify-content: space-between; margin-top: 15px; font-size: 0.85rem; color: #888; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 10px; }
        
        /* Auth Overlay styling */
        .auth-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #080911; display: flex; align-items: center; justify-content: center; z-index: 100; }
        .auth-box { background: #141627; padding: 30px; border-radius: 20px; text-align: center; width: 90%; max-width: 350px; border: 1px solid rgba(255,255,255,0.1); }
        .auth-input { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #2c3e50; background: #1c1f35; color: white; margin: 15px 0; text-align: center; font-size: 1rem; }
        .auth-btn { width: 100%; padding: 12px; border-radius: 10px; border: none; background: #f39c12; color: black; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div class="auth-overlay" id="authOverlay">
        <div class="auth-box">
            <h3 style="color: #f39c12;">Asteroid Miner Core</h3>
            <input type="text" id="usernameInput" class="auth-input" placeholder="Enter Pilot Call-Sign" maxlength="15">
            <button class="auth-btn" onclick="authenticateUser()">Engage Thrusters</button>
        </div>
    </div>

    <div class="game-container" id="gameContainer">
        <h1 id="playerDisplay">Sector Operations</h1>
        
        <div class="score-board">
            <div class="score-label">Cargo Hold (Gold)</div>
            <div class="score-value" id="goldDisplay">0</div>
        </div>

        <div class="score-label" id="levelDisplay" style="text-align: left; margin-bottom: 4px;">Rank 1: Space Recruit</div>
        <div class="progress-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <div class="asteroid-wrapper">
            <div class="crit-indicator" id="critRing"></div>
            <div class="asteroid" id="asteroidNode"></div>
        </div>

        <div class="score-label" style="text-align: left; margin-bottom: 5px;">Fleet Upgrades</div>
        <div class="shop-container">
            <div class="shop-item">
                <div class="item-info">
                    <div class="item-title">Auto-Drone</div>
                    <div class="item-desc" id="droneDesc">+1 Gold/sec</div>
                </div>
                <button class="btn-buy" id="buyDroneBtn" onclick="buyUpgrade('drone')">Buy (15)</button>
            </div>
            <div class="shop-item">
                <div class="item-info">
                    <div class="item-title">Heavy Frigate</div>
                    <div class="item-desc" id="frigateDesc">+8 Gold/sec</div>
                </div>
                <button class="btn-buy" id="buyFrigateBtn" onclick="buyUpgrade('frigate')">Buy (100)</button>
            </div>
        </div>

        <div class="stats-bar">
            <span id="gpsDisplay">0 / sec</span>
            <span id="rankDisplay">Recruit</span>
        </div>
    </div>

    <script>
        let currentUser = "";
        let localGold = 0;
        let localGps = 0;
        let critActive = false;
        const API_BASE = window.location.origin;

        // UI Binding Objects
        const asteroid = document.getElementById('asteroidNode');
        const critRing = document.getElementById('critRing');
        const goldDisplay = document.getElementById('goldDisplay');
        const progressBar = document.getElementById('progressBar');
        const levelDisplay = document.getElementById('levelDisplay');

        // Setup Event Listeners for Juicy Interaction
        asteroid.addEventListener('mousedown', (e) => spawnFloatingNumber(e));

        async function authenticateUser() {
            const name = document.getElementById('usernameInput').value.trim();
            if(!name) return alert("Call-Sign required.");
            currentUser = name;
            document.getElementById('playerDisplay').innerText = `Pilot: ${currentUser}`;

            const res = await fetch(`${API_BASE}/api/auth`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ username: currentUser })
            });
            const data = await res.json();
            document.getElementById('authOverlay').style.display = 'none';
            
            // Map legacy variables to server data structure
            localGold = data.gold;
            localGps = data.autoMiners * 1; 
            
            updateUI(data);
            startGameLoops();
        }

        async function registerClick() {
            let isCrit = false;
            if(critActive) {
                isCrit = true;
                critActive = false;
                critRing.classList.remove('crit-ready');
            }

            const res = await fetch(`${API_BASE}/api/click`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ username: currentUser, isCritical: isCrit })
            });
            const data = await res.json();
            localGold = data.gold;
            updateUI(data);
        }

        // Connect Client Clicks directly to async API execution
        asteroid.addEventListener('click', registerClick);

        async function buyUpgrade(type) {
            const res = await fetch(`${API_BASE}/api/upgrade`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ username: currentUser, upgradeType: type })
            });
            const data = await res.json();
            localGold = data.gold;
            updateUI(data);
        }

        function updateUI(data) {
            goldDisplay.innerText = Math.floor(localGold).toLocaleString();
            
            // Dynamically evaluate scaling ranks based on profile metrics
            let progressToNextRank = (localGold % 100);
            progressBar.style.width = `${progressToNextRank}%`;
            
            let levelVal = Math.floor(localGold / 100) + 1;
            levelDisplay.innerText = `Rank ${levelVal}: ${levelVal > 5 ? 'Galaxy Overseer' : 'Elite Prospector'}`;
            
            // Evaluate standard upgrade loops
            const droneCost = Math.floor(15 * Math.pow(1.15, data.autoMiners || 0));
            document.getElementById('buyDroneBtn').innerText = `Buy (${droneCost})`;
            document.getElementById('buyDroneBtn').disabled = localGold < droneCost;
            document.getElementById('droneDesc').innerText = `Owned: ${data.autoMiners || 0} (+${(data.autoMiners || 0)*1}/s)`;

            const frigateCost = Math.floor(100 * Math.pow(1.25, data.heavyFrigates || 0));
            document.getElementById('buyFrigateBtn').innerText = `Buy (${frigateCost})`;
            document.getElementById('buyFrigateBtn').disabled = localGold < frigateCost;
            document.getElementById('frigateDesc').innerText = `Owned: ${data.heavyFrigates || 0} (+${(data.heavyFrigates || 0)*8}/s)`;

            localGps = ((data.autoMiners || 0) * 1) + ((data.heavyFrigates || 0) * 8);
            document.getElementById('gpsDisplay').innerText = `${localGps} Gold / sec`;
        }

        function spawnFloatingNumber(e) {
            const num = document.createElement('div');
            num.classList.add('floating-num');
            
            if(critActive) {
                num.innerText = '+5 GOLD!!';
                num.style.color = '#e74c3c';
                num.style.fontSize = '2rem';
                // Trigger container shake effect
                document.getElementById('gameContainer').style.transform = 'translate(2px, 2px) rotate(1deg)';
                setTimeout(() => document.getElementById('gameContainer').style.transform = 'none', 100);
            } else {
                num.innerText = '+1';
                num.style.color = '#f1c40f';
            }

            // Calculate precise viewport positions relative to element box coordinates
            const rect = asteroid.getBoundingClientRect();
            num.style.left = `${e.clientX - rect.left + 40}px`;
            num.style.top = `${e.clientY - rect.top + 40}px`;

            asteroid.appendChild(num);
            setTimeout(() => num.remove(), 800);
        }

        function startGameLoops() {
            // 1. Idle Income Accumulation Generator
            setInterval(() => {
                if (localGps > 0) {
                    localGold += localGps;
                    goldDisplay.innerText = Math.floor(localGold).toLocaleString();
                }
            }, 1000);

            // 2. Random Critical Strike Alert Engine (Randomly pops up actions for the player)
            setInterval(() => {
                if(Math.random() > 0.6 && !critActive) {
                    critActive = true;
                    critRing.classList.add('crit-ready');
                    // Automatically turn off crit ring after 3 seconds if player misses it
                    setTimeout(() => {
                        critActive = false;
                        critRing.classList.remove('crit-ready');
                    }, 3000);
                }
            }, 4000);
        }
    </script>
</body>
</html>
