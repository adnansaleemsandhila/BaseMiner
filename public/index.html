<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚀 $PELICAN MEME HUB & LEADERBOARD 🚀</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Impact', 'Arial Black', sans-serif; user-select: none; }
        body { background: radial-gradient(circle, #7000ff 0%, #09001a 100%); color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        
        .layout-wrapper { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; width: 100%; max-width: 900px; }
        
        .meme-container, .leaderboard-container { background: rgba(0, 0, 0, 0.8); border: 4px solid #00ffff; border-radius: 30px; box-shadow: 0 0 25px #00ffff, inset 0 0 15px #ff007f; padding: 25px; text-align: center; flex: 1; min-width: 340px; max-width: 440px; }
        
        h1, h2 { font-size: 2.2rem; color: #00ffff; text-shadow: 3px 3px #ff007f; letter-spacing: 1px; margin-bottom: 10px; text-transform: uppercase; }
        h2 { font-size: 1.8rem; border-bottom: 2px dashed #ff007f; padding-bottom: 10px; }
        
        .ticker-name { font-size: 1.1rem; color: #fff; background: #ff007f; display: inline-block; padding: 2px 12px; border-radius: 8px; transform: rotate(-2deg); margin-bottom: 15px; }

        /* Web3 Connection Simulation Utility Bar */
        .web3-bar { margin-bottom: 15px; }
        .btn-wallet { background: linear-gradient(90deg, #ff007f, #7000ff); border: 2px solid #fff; color: white; padding: 8px 16px; font-size: 0.8rem; border-radius: 12px; cursor: pointer; box-shadow: 0 0 10px #ff007f; }

        .crypto-dashboard { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .data-tile { background: #111; border: 2px solid #333; padding: 10px; border-radius: 15px; text-align: left; }
        .tile-label { font-size: 0.7rem; color: #888; font-family: 'Arial', sans-serif; text-transform: uppercase; }
        .tile-value { font-size: 1.3rem; color: #00ffff; margin-top: 2px; }

        /* Pelican Art Engine Container */
        .character-zone { margin: 20px 0; display: flex; justify-content: center; position: relative; }
        .pelican-svg { width: 160px; height: 160px; filter: drop-shadow(0 0 15px #f1c40f); cursor: pointer; transition: transform 0.05s ease; }
        .pelican-svg:active { transform: scale(0.85) rotate(-5deg); }

        /* Floating Text Engine */
        .blast-text { position: absolute; font-size: 1.5rem; color: #ffff00; pointer-events: none; -webkit-text-stroke: 1px #000; animation: blast 0.6s ease-out forwards; z-index: 10; }
        @keyframes blast { 0% { opacity: 1; transform: translate(0,0) scale(0.6); } 100% { opacity: 0; transform: translate(var(--x), var(--y)) scale(1.3); } }

        /* Shop Layout Elements */
        .meme-btn { width: 100%; border: 3px solid #000; padding: 12px; border-radius: 15px; font-size: 1.1rem; font-weight: bold; cursor: pointer; text-transform: uppercase; background: #00ffff; box-shadow: 0 5px 0 #008888; margin-top: 10px; }
        .meme-btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #008888; }
        .meme-btn:disabled { background: #555; color: #888; cursor: not-allowed; box-shadow: none; transform: none; border-color: #333; }

        /* Leaderboard Board Metrics */
        .leaderboard-list { display: flex; flex-direction: column; gap: 10px; margin-top: 15px; }
        .leaderboard-row { display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.03); padding: 12px 15px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.05); font-family: 'Arial', sans-serif; font-size: 0.95rem; }
        .rank-num { font-weight: bold; color: #ff007f; font-size: 1.1rem; margin-right: 8px; }
        .player-address-hint { font-size: 0.7rem; color: #666; display: block; margin-top: 2px; }

        .community-alert { background: rgba(0,255,255,0.05); border: 2px dashed #ff007f; padding: 12px; border-radius: 12px; font-family: 'Arial', sans-serif; font-size: 0.8rem; line-height: 1.3; color: #ddd; margin-top: 15px; text-align: left; }
        
        .auth-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #060012; display: flex; align-items: center; justify-content: center; z-index: 100; }
        .auth-box { background: #110022; padding: 30px; border-radius: 25px; text-align: center; width: 90%; max-width: 350px; border: 2px solid #ff007f; box-shadow: 0 0 20px #ff007f; }
        .auth-input { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #333; background: #000; color: white; margin: 15px 0; text-align: center; font-size: 1rem; }
    </style>
</head>
<body>

    <div class="auth-overlay" id="authOverlay">
        <div class="auth-box">
            <h3 style="color: #00ffff; font-size: 1.6rem;">PILOT SIGN-IN</h3>
            <input type="text" id="usernameInput" class="auth-input" placeholder="Enter Callsign (e.g. Ali)" maxlength="12">
            <button class="meme-btn" onclick="authenticateUser()" style="margin: 0;">Claim Ship</button>
        </div>
    </div>

    <div class="layout-wrapper">
        <div class="meme-container">
            <h1 id="playerDisplay">Pelican Core</h1>
            <div class="ticker-name">$PELICAN</div>

            <div class="web3-bar">
                <button class="btn-wallet" id="walletBtn" onclick="simulateWalletConnect()">🔗 Link Base Wallet</button>
            </div>

            <div class="crypto-dashboard">
                <div class="data-tile">
                    <div class="tile-label">Mined Coins</div>
                    <div class="tile-value" id="coinsDisplay">0</div>
                </div>
                <div class="data-tile">
                    <div class="tile-label">Multiplier</div>
                    <div class="tile-value" id="multiplierDisplay" style="color: #ff007f;">1x</div>
                </div>
            </div>

            <div class="character-zone">
                <svg class="pelican-svg" id="pelicanAsset" viewBox="0 0 100 100" onclick="minePelican(event)">
                    <path d="M20,50 Q40,25 70,45 Q85,55 65,80 Q40,90 20,50" fill="#2980b9" stroke="#00ffff" stroke-width="2"/>
                    <path d="M60,40 Q95,35 85,60 Q65,65 55,45" fill="#f1c40f" stroke="#fff" stroke-width="2"/>
                    <circle cx="55" cy="40" r="4" fill="#000" stroke="#fff" stroke-width="1"/>
                    <circle cx="56" cy="39" r="1.5" fill="#fff"/>
                    <rect x="5" y="45" width="15" height="12" rx="3" fill="#e74c3c" transform="rotate(-15 10 45)"/>
                    <path d="M2,46 L-8,40 L-8,55 Z" fill="#ff007f"/>
                </svg>
            </div>

            <button class="meme-btn" id="upgradeBtn" onclick="buyUpgrade()" disabled>
                Faux-Staking Upgrade (Cost: 20)
            </button>

            <div class="community-alert">
                <strong>💡 Tipomics:</strong> Hire upgrades to expand your multiplier. Your player data is now locked firmly into Hostinger's SQLite local database matrix!
            </div>
        </div>

        <div class="leaderboard-container">
            <h2>🏆 GALACTIC TOP 5 🏆</h2>
            <div style="font-size: 0.75rem; color: #888; font-family: 'Arial'; margin-top: 4px;">Live updates every 3 seconds</div>
            
            <div class="leaderboard-list" id="leaderboardList">
                <div class="leaderboard-row">Scanning network grids...</div>
            </div>
        </div>
    </div>

    <script>
        let currentUser = "";
        let linkedWallet = "";
        const API_BASE = window.location.origin;

        const coinsDisplay = document.getElementById('coinsDisplay');
        const multiplierDisplay = document.getElementById('multiplierDisplay');
        const upgradeBtn = document.getElementById('upgradeBtn');
        const leaderboardList = document.getElementById('leaderboardList');
        const walletBtn = document.getElementById('walletBtn');
        const pelican = document.getElementById('pelicanAsset');

        const phrases = ["BZZZT!", "MOON!", "PUMP!", "HODL!", "BASE L2!", "WAGMI!", "RICH!"];

        async function authenticateUser() {
            const name = document.getElementById('usernameInput').value.trim();
            if(!name) return alert("Enter Pilot calls-sign.");
            currentUser = name;
            document.getElementById('playerDisplay').innerText = currentUser;

            const res = await fetch(`${API_BASE}/api/auth`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ username: currentUser, walletAddress: linkedWallet })
            });
            const data = await res.json();
            document.getElementById('authOverlay').style.display = 'none';
            
            updateUI(data);
            refreshLeaderboard();
            // Start continuous leaderboard background synced checker loop
            setInterval(refreshLeaderboard, 3000);
        }

        async function minePelican(e) {
            if(!currentUser) return;
            
            // Trigger visual text component explosion mechanics
            const pop = document.createElement('div');
            pop.classList.add('blast-text');
            pop.innerText = phrases[Math.floor(Math.random() * phrases.length)];
            pop.style.setProperty('--x', `${(Math.random() - 0.5) * 200}px`);
            pop.style.setProperty('--y', `${-(Math.random() * 100 + 40)}px`);
            pop.style.setProperty('--r', `${(Math.random() - 0.5) * 40}deg`);
            pop.style.left = `${e.clientX - pelican.getBoundingClientRect().left}px`;
            pop.style.top = `${e.clientY - pelican.getBoundingClientRect().top}px`;
            pelican.parentElement.appendChild(pop);
            setTimeout(() => pop.remove(), 600);

            const res = await fetch(`${API_BASE}/api/click`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ username: currentUser })
            });
            const data = await res.json();
            updateUI(data);
        }

        async function buyUpgrade() {
            const res = await fetch(`${API_BASE}/api/upgrade`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ username: currentUser })
            });
            const data = await res.json();
            updateUI(data);
        }

        async function refreshLeaderboard() {
            try {
                const res = await fetch(`${API_BASE}/api/leaderboard`);
                const rows = await res.json();
                leaderboardList.innerHTML = "";
                
                rows.forEach((row, index) => {
                    const rowDiv = document.createElement('div');
                    rowDiv.classList.add('leaderboard-row');
                    
                    // Format fake crypto addresses neatly if present
                    const walletHint = row.wallet_address ? 
                        `<span class="player-address-hint">💳 ${row.wallet_address.substring(0,6)}...${row.wallet_address.substring(38)}</span>` : 
                        `<span class="player-address-hint" style="color:#444;">No crypto wallet linked</span>`;

                    rowDiv.innerHTML = `
                        <div style="text-align:left;">
                            <span><span class="rank-num">#${index+1}</span><strong>${row.username}</strong></span>
                            ${walletHint}
                        </div>
                        <div style="color:#00ffff; font-size:1.1rem;">${Math.floor(row.coins).toLocaleString()}</div>
                    `;
                    leaderboardList.appendChild(rowDiv);
                });
            } catch(e) {
                console.error("Leaderboard refresh issue:", e);
            }
        }

        function simulateWalletConnect() {
            // Generates a mock public contract hash address string for early testing models
            const mockHex = "0x" + Array.from({length: 40}, () => Math.floor(Math.random()*16).toString(16)).join('');
            linkedWallet = mockHex;
            walletBtn.innerText = `🟢 ${mockHex.substring(0,6)}...${mockHex.substring(38)}`;
            walletBtn.disabled = true;
            
            if(currentUser) {
                fetch(`${API_BASE}/api/auth`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ username: currentUser, walletAddress: linkedWallet })
                }).then(() => refreshLeaderboard());
            }
        }

        function updateUI(data) {
            coinsDisplay.innerText = Math.floor(data.coins).toLocaleString();
            multiplierDisplay.innerText = `${data.multiplier}x`;
            
            const nextCost = Math.floor(20 * Math.pow(1.5, data.multiplier - 1));
            upgradeBtn.innerText = `Upgrade Faux-Staking (Cost: ${nextCost})`;
            upgradeBtn.disabled = data.coins < nextCost;
        }
    </script>
</body>
</html>
