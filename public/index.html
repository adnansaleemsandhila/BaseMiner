<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚀 MEME LAUNCHPAD: Space Pelican 🚀</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Impact', 'Arial Black', sans-serif; user-select: none; }
        body { background: radial-gradient(circle, #ff007f 0%, #1a0033 100%); color: #fff; display: flex; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
        
        .meme-container { width: 100%; max-width: 440px; padding: 20px; background: rgba(0, 0, 0, 0.75); border: 4px solid #00ffff; border-radius: 30px; box-shadow: 0 0 30px #00ffff, inset 0 0 20px #ff007f; text-align: center; position: relative; margin: 10px; }
        
        h1 { font-size: 2.2rem; color: #00ffff; text-shadow: 3px 3px #ff007f; letter-spacing: 1px; margin-bottom: 10px; text-transform: uppercase; }
        .ticker-name { font-size: 1.1rem; color: #fff; background: #ff007f; display: inline-block; padding: 2px 10px; border-radius: 8px; transform: rotate(-2deg); margin-bottom: 15px; }

        /* Faux-Crypto Token Dashboard */
        .crypto-dashboard { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .data-tile { background: #111; border: 2px solid #333; padding: 10px; border-radius: 15px; text-align: left; }
        .tile-label { font-size: 0.7rem; color: #888; font-family: 'Arial', sans-serif; text-transform: uppercase; }
        .tile-value { font-size: 1.3rem; color: #00ffff; margin-top: 2px; }

        /* The Hero Meme Character Asset */
        .character-zone { margin: 20px 0; display: flex; justify-content: center; position: relative; }
        .meme-avatar { width: 170px; height: 170px; background: #f1c40f; border-radius: 50%; border: 6px solid #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 5.5rem; box-shadow: 0 0 25px #f1c40f; transition: transform 0.05s ease; position: relative; }
        .meme-avatar:active { transform: scale(0.85) rotate(5deg); }

        /* Pop-text Animation styling */
        .meme-text { position: absolute; font-size: 1.6rem; color: #00ffff; pointer-events: none; -webkit-text-stroke: 1px #000; animation: blastOut 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; z-index: 10; }
        @keyframes blastOut { 0% { opacity: 1; transform: translate(0, 0) scale(0.5); } 100% { opacity: 0; transform: translate(var(--x), var(--y)) scale(1.4) rotate(var(--r)); } }

        /* Web3 Mechanic Buttons */
        .btn-panel { display: flex; flex-direction: column; gap: 10px; margin-top: 15px; }
        .meme-btn { width: 100%; border: 3px solid #000; padding: 12px; border-radius: 15px; font-size: 1.1rem; color: #000; font-weight: bold; cursor: pointer; transition: all 0.1s; text-transform: uppercase; }
        .btn-pump { background: #00ffff; box-shadow: 0 5px 0 #008888; }
        .btn-pump:active { transform: translateY(4px); box-shadow: 0 1px 0 #008888; }
        .btn-pump:disabled { background: #555; color: #888; cursor: not-allowed; box-shadow: none; transform: none; }

        .community-alert { background: rgba(0,255,255,0.1); border: 2px dashed #00ffff; padding: 10px; border-radius: 12px; font-family: 'Arial', sans-serif; font-size: 0.8rem; line-height: 1.3; color: #ddd; margin-top: 15px; text-align: left; }
    </style>
</head>
<body>

    <div class="meme-container">
        <h1>Space Pelican</h1>
        <div class="ticker-name">$PELICAN</div>

        <div class="crypto-dashboard">
            <div class="data-tile">
                <div class="tile-label">Simulated Coins Mineable</div>
                <div class="tile-value" id="coinsDisplay">0</div>
            </div>
            <div class="data-tile">
                <div class="tile-label">Multiplier Level</div>
                <div class="tile-value" id="multiplierDisplay" style="color: #ff007f;">1x</div>
            </div>
        </div>

        <div class="character-zone">
            <div class="meme-avatar" id="memeCharacter" onclick="triggerMemeBlast()">🐧</div>
        </div>

        <div class="btn-panel">
            <button class="meme-btn btn-pump" id="upgradeBtn" onclick="buyMultiplier()" disabled>
                Buy Faux-Staking Upgrade (Cost: 20)
            </button>
        </div>

        <div class="community-alert" id="jokeAlert">
            <strong>📢 Crypto Lesson:</strong> Welcome to the launchpad! Click the Pelican to "mine" coins. Real token economies use "Staking" to increase earnings velocity over time. Try upgrading your staking level!
        </div>
    </div>

    <script>
        let coins = 0;
        let multiplier = 1;
        let username = "Pilot_" + Math.floor(Math.random() * 1000);

        const coinsDisplay = document.getElementById('coinsDisplay');
        const multiplierDisplay = document.getElementById('multiplierDisplay');
        const upgradeBtn = document.getElementById('upgradeBtn');
        const jokeAlert = document.getElementById('jokeAlert');
        const avatar = document.getElementById('memeCharacter');

        const memePhrases = ["TO THE MOON!", "HODL!", "MUCH WOW!", "PUMP IT!", "BASE CHAIN!", "WAGMI!", "LIQUIDITY!!"];
        const funEmojis = ["🚀", "💎", "🌕", "📈", "💵", "🔥"];

        const eduTips = [
            "💡 Staking means locking up tokens to secure network actions while earning passive yields over long periods.",
            "💡 Market Cap is computed by multiplying the total floating token supply by the current individual asset price.",
            "💡 A Gas Fee is a micro-payment made to miners or validators to process transactions securely on a layer-2 network.",
            "💡 Smart Contracts are completely automated, self-executing code blocks that nobody can change once deployed."
        ];

        function triggerMemeBlast() {
            coins += 1 * multiplier;
            coinsDisplay.innerText = coins.toLocaleString();
            
            // Randomly flash a funny emoji swap on the character
            if(Math.random() > 0.7) {
                const randomEmoji = funEmojis[Math.floor(Math.random() * funEmojis.length)];
                avatar.innerText = randomEmoji;
                setTimeout(() => avatar.innerText = "🐧", 150);
            }

            // Create beautiful explosive text vectors
            const pop = document.createElement('div');
            pop.classList.add('meme-text');
            pop.innerText = memePhrases[Math.floor(Math.random() * memePhrases.length)];
            
            // Random direction vectors for the explosion animation
            const xDir = (Math.random() - 0.5) * 250;
            const yDir = -(Math.random() * 150 + 50);
            const rot = (Math.random() - 0.5) * 60;
            pop.style.setProperty('--x', `${xDir}px`);
            pop.style.setProperty('--y', `${yDir}px`);
            pop.style.setProperty('--r', `${rot}deg`);

            avatar.appendChild(pop);
            setTimeout(() => pop.remove(), 600);

            evaluateUpgrades();
        }

        function buyMultiplier() {
            const nextCost = Math.floor(20 * Math.pow(1.5, multiplier - 1));
            if (coins >= nextCost) {
                coins -= nextCost;
                multiplier += 1;
                
                coinsDisplay.innerText = coins.toLocaleString();
                multiplierDisplay.innerText = `${multiplier}x`;
                
                // Show an educational tooltip every time they buy an upgrade
                jokeAlert.innerHTML = `<strong>📢 Tokenomics Concept:</strong> ${eduTips[(multiplier - 2) % eduTips.length]}`;
                
                evaluateUpgrades();
            }
        }

        function evaluateUpgrades() {
            const nextCost = Math.floor(20 * Math.pow(1.5, multiplier - 1));
            upgradeBtn.innerText = `Upgrade Faux-Staking (Cost: ${nextCost})`;
            upgradeBtn.disabled = coins < nextCost;
        }
    </script>
</body>
</html>
