<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asteroid Miner Tycoon</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: radial-gradient(circle, #101223 0%, #050508 100%); color: #fff; display: flex; align-items: center; justify-content: center; min-height: 100vh; overflow-x: hidden; }
        .game-container { width: 100%; max-width: 450px; padding: 25px; text-align: center; background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 24px; backdrop-filter: blur(10px); box-shadow: 0 20px 50px rgba(0,0,0,0.5); margin: 15px; }
        h1 { font-size: 1.8rem; letter-spacing: 2px; color: #f39c12; text-shadow: 0 0 10px rgba(243, 156, 18, 0.4); margin-bottom: 20px; }
        .score-board { background: rgba(0, 0, 0, 0.4); padding: 15px; border-radius: 16px; margin-bottom: 30px; border-bottom: 2px solid #f39c12; }
        .score-label { font-size: 0.9rem; text-transform: uppercase; color: #aaa; letter-spacing: 1px; }
        .score-value { font-size: 2.5rem; font-weight: bold; color: #f1c40f; margin-top: 5px; }
        .asteroid-wrapper { margin: 40px 0; display: flex; justify-content: center; }
        .asteroid { width: 180px; height: 180px; background: radial-gradient(circle, #8e44ad 10%, #2c3e50 100%); border-radius: 35% 65% 55% 45% / 45% 35% 65% 55%; box-shadow: inset -10px -10px 30px rgba(0,0,0,0.7), 0 0 30px rgba(142, 68, 173, 0.5); cursor: pointer; transition: transform 0.05s ease, filter 0.1s; animation: float 6s ease-in-out infinite; }
        .asteroid:active { transform: scale(0.92); filter: brightness(1.3); }
        @keyframes float { 0%, 100% { transform: translateY(0px) rotate(0deg); } 50% { transform: translateY(-10px) rotate(5deg); } }
        .btn-upgrade { width: 100%; background: linear-gradient(135deg, #27ae60 0%, #2ecc71 100%); color: white; border: none; padding: 15px; border-radius: 14px; font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: all 0.2s; box-shadow: 0 5px 15px rgba(46, 204, 113, 0.3); }
        .btn-upgrade:hover { transform: translateY(-2px); box-shadow: 0 7px 20px rgba(46, 204, 113, 0.5); }
        .btn-upgrade:disabled { background: #7f8c8d; opacity: 0.4; transform: none; box-shadow: none; cursor: not-allowed; }
        .stats { margin-top: 20px; font-size: 0.9rem; color: #888; display: flex; justify-content: space-between; }
        .auth-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0b0c16; display: flex; align-items: center; justify-content: center; z-index: 100; transition: opacity 0.3s; }
        .auth-box { background: #15182d; padding: 30px; border-radius: 20px; text-align: center; width: 90%; max-width: 360px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .auth-input { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #34495e; background: #2c3e50; color: white; margin: 15px 0; font-size: 1rem; text-align: center; }
        .auth-btn { width: 100%; padding: 12px; border-radius: 10px; border: none; background: #f39c12; color: black; font-weight: bold; cursor: pointer; font-size: 1rem; }
    </style>
</head>
<body>

    <div class="auth-overlay" id="authOverlay">
        <div class="auth-box">
            <h3>Enter the Mining Sector</h3>
            <input type="text" id="usernameInput" class="auth-input" placeholder="Create Secret Pilot Name" maxlength="15">
            <button class="auth-btn" onclick="authenticateUser()">Launch Game</button>
        </div>
    </div>

    <div class="game-container">
        <h1 id="playerDisplay">Asteroid Miner</h1>
        <div class="score-board">
            <div class="score-label">Total Gold Extracted</div>
            <div class="score-value" id="goldDisplay">0</div>
        </div>

        <div class="asteroid-wrapper">
            <div class="asteroid" id="asteroidNode" onclick="registerClick()"></div>
        </div>

        <button class="btn-upgrade" id="upgradeBtn" onclick="buyUpgrade()" disabled>
            Hire Auto-Miner (Cost: 15 Gold)
        </button>

        <div class="stats">
            <span id="minerCountDisplay">Auto-Miners: 0</span>
            <span id="gpsDisplay">0 Gold/sec</span>
        </div>
    </div>

    <script>
        let currentUser = "";
        const API_BASE = window.location.origin;

        // UI Target Bindings
        const goldDisplay = document.getElementById('goldDisplay');
        const upgradeBtn = document.getElementById('upgradeBtn');
        const minerCountDisplay = document.getElementById('minerCountDisplay');
        const gpsDisplay = document.getElementById('gpsDisplay');

        async function authenticateUser() {
            const name = document.getElementById('usernameInput').value.trim();
            if(!name) return alert("Please specify your Pilot Name.");
            
            currentUser = name;
            document.getElementById('playerDisplay').innerText = `Pilot: ${currentUser}`;

            const res = await fetch(`${API_BASE}/api/auth`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ username: currentUser })
            });
            const data = await res.json();
            document.getElementById('authOverlay').style.display = 'none';
            updateUI(data);
            startClientIdleEngine();
        }

        async function registerClick() {
            if(!currentUser) return;
            const res = await fetch(`${API_BASE}/api/click`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ username: currentUser })
            });
            const data = await res.json();
            updateUI(data);
        }

        async function buyUpgrade() {
            if(!currentUser) return;
            const res = await fetch(`${API_BASE}/api/upgrade`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ username: currentUser })
            });
            const data = await res.json();
            updateUI(data);
        }

        function updateUI(userData) {
            goldDisplay.innerText = Math.floor(userData.gold).toLocaleString();
            minerCountDisplay.innerText = `Auto-Miners: ${userData.autoMiners}`;
            gpsDisplay.innerText = `${userData.autoMiners * 1} Gold/sec`;

            // Deduce cost locally merely to render button styling state
            const currentMiners = userData.autoMiners;
            const nextCost = Math.floor(15 * Math.pow(1.15, currentMiners));
            upgradeBtn.innerText = `Hire Auto-Miner (Cost: ${nextCost} Gold)`;
            upgradeBtn.disabled = userData.gold < nextCost;
        }

        // Smooth frontend emulation of backend ticks (keeps experience dynamic)
        function startClientIdleEngine() {
            setInterval(() => {
                const currentGps = parseInt(gpsDisplay.innerText);
                if (currentGps > 0) {
                    let currentGold = parseInt(goldDisplay.innerText.replace(/,/g, ''));
                    currentGold += currentGps;
                    goldDisplay.innerText = currentGold.toLocaleString();
                }
            }, 1000);
        }
    </script>
</body>
</html>
